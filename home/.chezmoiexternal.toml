{{ if and (eq .chezmoi.os "linux") (eq .chezmoi.osRelease.id "ubuntu") -}}
{{/* Zellij has neither an Ubuntu package nor a self-updater, so it is the only pinned download. */ -}}
{{ $zellij := dict
    "amd64" (dict "arch" "x86_64" "sha" "40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc")
    "arm64" (dict "arch" "aarch64" "sha" "05f0802afadd53f8db9514e7cae53c9ae8432fed1b35b8294aa816ee3044a16b") -}}
{{ $release := index $zellij .chezmoi.arch -}}
{{ if not $release -}}
{{ fail "Zellij requires Ubuntu amd64 or arm64" -}}
{{ end -}}
[".local/bin/zellij"]
type = "archive-file"
url = "https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-{{ $release.arch }}-unknown-linux-musl.tar.gz"
path = "zellij"
executable = true
checksum.sha256 = "{{ $release.sha }}"
{{ end -}}
