name: Verify

on:
  pull_request:
  schedule:
    # Catch upstream package, repository and key changes before the next setup needs them.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install chezmoi
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'chezmoi'
          gh release download --repo twpayne/chezmoi --dir $directory `
            --pattern 'chezmoi-windows-amd64.exe' --pattern 'chezmoi_*_checksums.txt'
          $hash = (Get-FileHash (Join-Path $directory 'chezmoi-windows-amd64.exe')).Hash
          if (!((Get-Content (Get-Item "$directory/chezmoi_*_checksums.txt")) -match "^$hash  chezmoi-windows-amd64\.exe$")) {
            throw 'chezmoi checksum mismatch.'
          }
          Rename-Item (Join-Path $directory 'chezmoi-windows-amd64.exe') 'chezmoi.exe'
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify Windows
        shell: pwsh
        run: ./tests/verify-windows.ps1

  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build verification container
        run: docker build --tag dotfiles-verify .devcontainer
      - name: Verify Ubuntu
        env:
          # mise resolves latest releases through the GitHub API; avoid anonymous rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm --env GITHUB_TOKEN
          --mount "type=bind,source=$PWD,target=/workspaces/dotfiles,readonly"
          dotfiles-verify bash tests/verify-ubuntu.sh
