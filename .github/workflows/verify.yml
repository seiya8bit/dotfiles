name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install verification tool
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'dotfiles-tools'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $binary = Join-Path $directory 'chezmoi.exe'
          Invoke-WebRequest 'https://github.com/twpayne/chezmoi/releases/download/v2.72.1/chezmoi-windows-amd64.exe' -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne '82ba47ad6212322067b0dcac0b1e390861a87e5bda7d5a8819724be5ff1960e7') {
            throw 'chezmoi checksum mismatch.'
          }
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify Windows
        shell: pwsh
        run: ./tests/verify-windows.ps1

  ubuntu:
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build verification container
        run: docker build --tag dotfiles-verify .devcontainer
      - name: Verify Ubuntu
        run: >-
          docker run --rm
          --mount "type=bind,source=$PWD,target=/workspaces/dotfiles,readonly"
          dotfiles-verify bash tests/verify-ubuntu.sh
