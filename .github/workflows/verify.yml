name: Verify

on: pull_request

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Not in mise.toml: its shim would shadow WinGet's chezmoi outside this repository.
      - uses: jdx/mise-action@v5
        with:
          tool_versions: chezmoi latest
      - name: Verify Windows
        shell: pwsh
        run: ./tests/verify-windows.ps1
      - name: Check agent files
        shell: pwsh
        run: rulesync generate --check
