name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'chezmoi'
          gh release download --repo twpayne/chezmoi --dir $directory `
            --pattern 'chezmoi-windows-amd64.exe' --pattern 'chezmoi_*_checksums.txt'
          $hash = (Get-FileHash (Join-Path $directory 'chezmoi-windows-amd64.exe')).Hash
          if (!((Get-Content (Get-Item "$directory/chezmoi_*_checksums.txt")) -match "^$hash  chezmoi-windows-amd64\.exe$")) {
            throw 'chezmoi checksum mismatch.'
          }
          Rename-Item (Join-Path $directory 'chezmoi-windows-amd64.exe') 'chezmoi.exe'
          $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Verify Windows
        shell: pwsh
        run: ./tests/verify-windows.ps1
